name: med_static_parent_removal_low_power_4routers
title: Static low-power stock MED parent-removal benchmark with 4 routers
description: >
  OTNS counterpart of the ESPHome stock_low_power hardware benchmark. Nodes
  use the same horizontal 10 cm geometry. Routers 1/2 and the MED use +20 dBm;
  Routers 3/4 use -15 dBm so they remain communicable but rank below the
  remaining strong router during the second attach. The FTD build must include
  only the Parent Response delay diagnostic, with stock parent selection
  otherwise unchanged.

scenario_type: static_parent_removal
device_profile: minimal_end_device

coordinate_system:
  meter_per_unit: 0.1
  source: "Hardware bench approximation; OTNS integer coordinates use 0.1 m units"

observability:
  packet_probe_reliable: true
  primary_parent_observation: packet_probe

radio_model:
  preferred: MutualInterference
  fallbacks:
    - MIDisc
    - Ideal_Rssi
    - Ideal

timing:
  router_settling_seconds: 300
  child_attach_seconds: 5
  after_parent_removed_seconds: 360
  step_seconds: 1

activation:
  initial_nodes:
    - router_a
    - router_b
    - router_c
    - router_d
  child_node: mobile

removal:
  target: observed_mobile_parent

nodes:
  router_a:
    type: router
    x: 0
    y: 0
    tx_power_dbm: 20
  router_b:
    type: router
    x: 1
    y: 0
    tx_power_dbm: 20
  router_c:
    type: router
    x: 3
    y: 0
    tx_power_dbm: -15
  router_d:
    type: router
    x: 4
    y: 0
    tx_power_dbm: -15
  mobile:
    type: med
    x: 2
    y: 0
    tx_power_dbm: 20
