name: med_directed_ucast_fast_attach_1_2routers
title: Directed unicast Fast Attach (fixed 1 ms) MED parent switch with 2 routers
description: Deterministic Fast Attach (fixed 1 ms) preferred-parent unicast switch matching the ESPHome hardware procedure.
scenario_type: directed_parent_switch
device_profile: minimal_end_device
radio_model: {preferred: MutualInterference, fallbacks: [MIDisc, Ideal_Rssi, Ideal]}
timing: {router_settling_seconds: 180, child_attach_seconds: 5, after_parent_removed_seconds: 255, step_seconds: 1}
activation: {initial_nodes: [router_a, router_b], child_node: mobile}
directed_switch:
  mode: unicast
  target_selection: random_non_current_parent
  remove_initial_parent: false
  random_seed: 3102
  expected_router_firmware: fast-attach-ucast-1
nodes:
  router_a: {type: router, x: 300, y: 300, tx_power_dbm: 0, firmware_profile: fast-attach-ucast-1}
  router_b: {type: router, x: 450, y: 300, tx_power_dbm: 0, firmware_profile: fast-attach-ucast-1}
  mobile: {type: med, x: 375, y: 300, tx_power_dbm: 0, firmware_profile: fast-attach-ucast-1}
